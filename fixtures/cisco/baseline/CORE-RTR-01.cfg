!
! Last configuration change at 01:12:33 UTC Wed May 1 2024
!
version 15.7
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname CORE-RTR-01
!
boot-start-marker
boot-end-marker
!
enable secret 5 $1$abcd$XXXXXXXXXXXXXXXXXXXXXX
!
no aaa new-model
!
ip cef
no ipv6 cef
!
ip domain name lab.example.net
ip name-server 10.10.20.53
!
banner motd ^C
Authorized access only. CORE-RTR-01 lab core router.
^C
!
interface Loopback0
 description Router ID
 ip address 10.255.0.1 255.255.255.255
!
interface GigabitEthernet0/0
 description Downlink to DIST-SW-01 Gi1/0/24
 ip address 10.0.0.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description Uplink to EDGE-FW-01 Gi0/0
 ip address 10.0.1.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/2
 description Second downlink to DIST-SW-01 Gi1/0/23
 ip address 10.0.2.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/3
 description Unused
 shutdown
!
ip forward-protocol nd
!
ip route 0.0.0.0 0.0.0.0 10.0.1.2 name DEFAULT-TO-EDGE
ip route 10.10.10.0 255.255.255.0 10.0.0.2 name USERS-VIA-DIST
ip route 10.10.10.0 255.255.255.0 10.0.2.2 name USERS-VIA-DIST-2
ip route 10.10.20.0 255.255.255.0 10.0.0.2 name SERVERS-VIA-DIST
ip route 10.10.20.0 255.255.255.0 10.0.2.2 name SERVERS-VIA-DIST-2
ip route 10.10.30.0 255.255.255.0 10.0.0.2 name VOICE-VIA-DIST
ip route 10.10.30.0 255.255.255.0 10.0.2.2 name VOICE-VIA-DIST-2
ip route 10.10.60.0 255.255.255.0 10.0.0.2 name LAB-VIA-DIST
ip route 10.10.60.0 255.255.255.0 10.0.2.2 name LAB-VIA-DIST-2
ip route 10.10.99.0 255.255.255.0 10.0.0.2 name MGMT-VIA-DIST
ip route 10.10.99.0 255.255.255.0 10.0.2.2 name MGMT-VIA-DIST-2
ip route 10.66.66.0 255.255.255.0 Null0 name BLACKHOLE-DEMO
!
ip access-list extended MGMT-PROTECT
 permit tcp 10.10.99.0 0.0.0.255 any eq 22
 permit icmp 10.10.99.0 0.0.0.255 any
 deny   ip any any log
!
snmp-server community labro RO
ntp server 10.10.20.123
!
line con 0
 logging synchronous
line vty 0 4
 login local
 transport input ssh
!
