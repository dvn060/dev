!
! Last configuration change at 22:41:10 UTC Tue Jun 4 2024
!
version 16.12
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname DIST-SW-01
!
boot system flash bootflash:packages.conf
!
enable secret 9 $9$abcd$YYYYYYYYYYYYYYYYYYYYYY
!
no aaa new-model
!
ip routing
!
vlan 10
 name USERS
!
vlan 20
 name SERVERS
!
vlan 30
 name VOICE
!
vlan 99
 name MGMT
!
interface Port-channel1
 description Downlink to ACCESS-SW-01
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,99
!
interface GigabitEthernet1/0/1
 description ACCESS-SW-01 uplink member 1
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,99
 channel-group 1 mode active
!
interface GigabitEthernet1/0/2
 description ACCESS-SW-01 uplink member 2
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,99
 channel-group 1 mode active
!
interface GigabitEthernet1/0/10
 description Server APP-01 (10.10.20.50)
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
!
interface GigabitEthernet1/0/24
 description Routed uplink to CORE-RTR-01 Gi0/0
 no switchport
 ip address 10.0.0.2 255.255.255.252
!
interface Vlan10
 description Users gateway
 ip address 10.10.10.1 255.255.255.0
!
interface Vlan20
 description Servers gateway
 ip address 10.10.20.1 255.255.255.0
 ip access-group SERVERS-IN out
!
interface Vlan30
 description Voice gateway
 ip address 10.10.30.1 255.255.255.0
!
interface Vlan99
 description Management gateway
 ip address 10.10.99.1 255.255.255.0
!
ip route 0.0.0.0 0.0.0.0 10.0.0.1 name DEFAULT-TO-CORE
!
ip access-list extended SERVERS-IN
 remark Allow user segment to reach APP-01 web services
 permit tcp 10.10.10.0 0.0.0.255 host 10.10.20.50 eq www
 permit icmp 10.10.10.0 0.0.0.255 10.10.20.0 0.0.0.255 echo
 permit udp 10.10.99.0 0.0.0.255 host 10.10.20.53 eq domain
 permit tcp any any established
 deny   ip any any log
!
snmp-server community labro RO
ntp server 10.10.20.123
!
line con 0
 logging synchronous
line vty 0 4
 login local
 transport input ssh
!
end
