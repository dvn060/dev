!Command: show running-config all
!Time: Wed May  1 02:20:11 2024
version 9.3(8) Bios:version 05.47
hostname NXOS-CORE-01

feature interface-vlan
feature hsrp
feature lacp

vlan 110
  name PROD-APP
vlan 120
  name PROD-DB

ip access-list APP-TO-DB
  10 permit tcp 10.20.110.0/24 10.20.120.0/24 eq 1433
  20 permit icmp 10.20.110.0/24 10.20.120.0/24
  30 deny ip any any

vrf context management
  ip route 0.0.0.0/0 10.20.99.1

interface Vlan110
  description PROD app servers gateway
  no shutdown
  ip address 10.20.110.2/24
  ip access-group APP-TO-DB in
  hsrp 110
    priority 110
    ip 10.20.110.1

interface Vlan120
  description PROD database gateway
  no shutdown
  ip address 10.20.120.2/24
  hsrp 120
    ip 10.20.120.1

interface port-channel10
  description Downstream trunk to PROD access pair
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 110,120

interface Ethernet1/1
  description po10 member 1
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 110,120
  channel-group 10 mode active
  no shutdown

interface Ethernet1/2
  description po10 member 2
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 110,120
  channel-group 10 mode active
  no shutdown

interface mgmt0
  vrf member management
  ip address 10.20.99.10/24

ip route 0.0.0.0/0 10.20.110.254

line console
line vty
