version 15.7
service timestamps log datetime msec
!
hostname EDGE-FW-01
!
enable secret 5 $1$abcd$WWWWWWWWWWWWWWWWWWWWWW
!
no aaa new-model
!
ip cef
!
interface Loopback0
 description Router ID
 ip address 10.255.0.4 255.255.255.255
