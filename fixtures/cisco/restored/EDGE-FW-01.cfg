ip route 0.0.0.0 0.0.0.0 198.51.100.1 name DEFAULT-TO-ISP
ip route 10.10.0.0 255.255.0.0 10.0.1.1 name INSIDE-SUMMARY
ip route 10.255.0.0 255.255.255.0 10.0.1.1 name LOOPBACKS
