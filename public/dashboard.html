<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Dashboard - Math Adventure</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="dashboard">
  <div class="stars"></div>

  <div class="navbar">
    <div class="user-info">
      <div class="user-avatar" id="user-avatar">🦁</div>
      <div class="user-details">
        <h2 id="user-name">Loading...</h2>
        <p>Math Explorer</p>
        <div id="user-currency" style="display: flex; gap: 15px; margin-top: 5px; font-size: 1.1em;">
          <span>⭐ <strong id="stars">0</strong></span>
          <span>🪙 <strong id="coins">0</strong></span>
          <span>Level <strong id="level">1</strong></span>
        </div>
      </div>
    </div>
    <div style="display: flex; gap: 10px;">
      <button class="btn btn-secondary" onclick="window.location.href='/avatar'">👤 Avatar</button>
      <button class="btn btn-secondary" onclick="window.location.href='/shop'">🛒 Shop</button>
      <button class="btn btn-danger" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-icon">🎮</div>
      <div class="stat-value" id="total-games">0</div>
      <div class="stat-label">Games Played</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">✅</div>
      <div class="stat-value" id="total-correct">0</div>
      <div class="stat-label">Correct Answers</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">🏆</div>
      <div class="stat-value" id="high-score">0</div>
      <div class="stat-label">High Score</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">🎯</div>
      <div class="stat-value" id="accuracy">0%</div>
      <div class="stat-label">Accuracy</div>
    </div>
  </div>

  <div class="game-menu">
    <div class="game-card" onclick="window.location.href='/campaign?type=math'">
      <div class="game-icon">📚</div>
      <h3>Math Campaign</h3>
      <p>No timer! Progress through levels at your own pace</p>
      <button class="btn btn-primary">Start Campaign!</button>
    </div>
    <div class="game-card" onclick="window.location.href='/campaign?type=reading'">
      <div class="game-icon">📖</div>
      <h3>Reading Campaign</h3>
      <p>Learn and practice reading skills!</p>
      <button class="btn btn-primary">Start Reading!</button>
    </div>
    <div class="game-card" onclick="startGame('addition')">
      <div class="game-icon">⚡</div>
      <h3>Timed Challenge</h3>
      <p>Race against the clock!</p>
      <button class="btn btn-success">Play Now!</button>
    </div>
  </div>

  <div class="badges-section">
    <h2>🏅 My Badges</h2>
    <div class="badges-grid" id="badges-grid">
      <div class="loading" style="margin: 20px auto;"></div>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
