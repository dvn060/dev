<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop - Math Adventure</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="dashboard">
  <div class="stars"></div>

  <div class="navbar">
    <div class="user-info">
      <div class="user-avatar" id="user-avatar">🦁</div>
      <div class="user-details">
        <h2 id="user-name">Loading...</h2>
        <p>Item Shop</p>
        <div style="display: flex; gap: 20px; margin-top: 5px; font-size: 1.3em;">
          <span>⭐ <strong id="stars">0</strong></span>
          <span>🪙 <strong id="coins">0</strong></span>
        </div>
      </div>
    </div>
    <button class="btn btn-danger" onclick="window.location.href='/dashboard'">⬅️ Back</button>
  </div>

  <div style="max-width: 1400px; margin: 0 auto; padding: 20px;">
    <!-- Shop Header -->
    <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 40px; border-radius: 20px; margin-bottom: 30px; text-align: center; color: white;">
      <h1 style="font-size: 3em; margin-bottom: 10px;">🛒 Item Shop</h1>
      <p style="font-size: 1.3em; opacity: 0.9;">Unlock awesome items and pets!</p>
      <div style="background: rgba(255,255,255,0.2); padding: 15px; border-radius: 15px; margin-top: 20px; display: inline-block;">
        <p style="margin: 0; font-size: 1.1em;">💡 Earn coins and stars by playing Campaign Mode!</p>
      </div>
    </div>

    <!-- Filter Tabs -->
    <div style="background: white; padding: 20px; border-radius: 15px; margin-bottom: 30px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);">
      <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;">
        <button class="tab-btn active" onclick="filterShop('all', this)">All Items</button>
        <button class="tab-btn" onclick="filterShop('avatar_item', this)">Avatar Items</button>
        <button class="tab-btn" onclick="filterShop('pet', this)">Pets</button>
        <button class="tab-btn" onclick="filterShop('common', this)">Common</button>
        <button class="tab-btn" onclick="filterShop('rare', this)">Rare</button>
        <button class="tab-btn" onclick="filterShop('epic', this)">Epic</button>
        <button class="tab-btn" onclick="filterShop('legendary', this)">Legendary</button>
        <button class="tab-btn" onclick="filterShop('affordable', this)">💰 I Can Buy</button>
      </div>
    </div>

    <!-- Shop Items Grid -->
    <div id="shop-items" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px;">
      <div class="loading" style="grid-column: 1/-1; margin: 50px auto;"></div>
    </div>
  </div>

  <!-- Purchase Confirmation Modal -->
  <div id="purchase-modal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 1000; display: flex; align-items: center; justify-content: center;">
    <div style="background: white; padding: 40px; border-radius: 20px; max-width: 500px; text-align: center; animation: popIn 0.3s;">
      <div id="modal-item-icon" style="font-size: 6em; margin-bottom: 20px;">🎁</div>
      <h2 id="modal-item-name" style="color: #333; margin-bottom: 10px;">Item Name</h2>
      <p id="modal-item-description" style="color: #666; margin-bottom: 20px;">Description</p>

      <div id="modal-cost" style="background: #f0f0f0; padding: 20px; border-radius: 15px; margin-bottom: 30px;">
        <div style="font-size: 1.5em; font-weight: bold; color: #333;">
          <span id="modal-cost-icon">🪙</span>
          <span id="modal-cost-amount">100</span>
        </div>
      </div>

      <div style="display: flex; gap: 15px; justify-content: center;">
        <button class="btn btn-success" onclick="confirmPurchase()" style="padding: 15px 30px; font-size: 1.2em;">
          Buy Now! 💳
        </button>
        <button class="btn btn-secondary" onclick="closePurchaseModal()" style="padding: 15px 30px; font-size: 1.2em;">
          Cancel
        </button>
      </div>
    </div>
  </div>

  <script src="shop.js"></script>
</body>
</html>
